    <style>
        @font-face {
            font-family: 'Ubuntu';
            src: url('https://vanilla-picture-with-picgo.oss-cn-shenzhen.aliyuncs.com/cdn-hexo/fonts/Ubuntu-B.ttf') format('truetype');
            /* 确保替换为实际的文件路径 */
            font-weight: bold;
            /* 指定字体粗细 */
            font-style: normal;
            /* 指定字体样式 */
        }


        body,
        html {
            height: 100%;
            margin: 0;
            font-family: 'Ubuntu', Arial, sans-serif;
            font-weight: bold;
            overflow: hidden;
        }

        .bg {
            position: relative;
            height: 100%;
        }

        .bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('sources/ord2(bigjpgx4) (2560x1440)(jpg50).jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            filter: blur(1px);
            /* 应用高斯模糊 */
            z-index: -1;
        }

        .content {
            text-align: center;
            position: relative;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            background: rgba(243, 220, 224, 0.60);
            /* 半透明黑色背景 */
            border-radius: 16px;
            /* 圆角 */
            padding: 20px;
            /* 内边距 */
            max-width: 512px;
            /* 最大宽度 */
            max-height: 420px;
            /* 最大高度 */
            margin: auto;
            /* 水平居中 */
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
            /* 阴影效果 */
        }

        .content img {
            border-radius: 50%;
            width: 150px;
            height: 150px;
            object-fit: cover;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
            /* 添加阴影效果 */
        }

        .content .icon-wechat {
            margin: 4px auto;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            object-fit: cover;
            box-shadow: 0 0 0 0;
        }

        .content h1 {
            font-size: 2.2em;
        }

        .content h2 {
            font-size: 1.2em;
            color: #f0f0f0;
        }

        .links {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .links a {
            position: relative;
            /* 使链接支持绝对定位的子元素 */
            margin: 0 10px;
            text-decoration: none;
            font-size: 1.5em;
        }

        .divider {
            height: 4px;
            /* 分隔线的厚度 */
            background-color: rgba(255, 255, 255, 0.6);
            /* 半透明的白色 */
            margin: 20px auto;
            /* 上下边距20px，左右自动居中 */
            width: 75%;
            /* 分隔线宽度为容器宽度的50% */
        }

        .tooltip-text {
            position: absolute;
            bottom: -32px;
            /* 根据实际情况调整位置 */
            left: 50%;
            transform: translateX(-50%);
            visibility: hidden;
            background-color: rgba(41, 41, 41, 0.9);
            color: white;
            text-align: center;
            border-radius: 3px;
            padding: 5px 10px;
            white-space: nowrap;
            /* 防止文本换行 */
            opacity: 0;
            transition: opacity 0.5s, visibility 0.5s;
            min-width: 40px;
            /* 设置最小宽度 */
            font-size: 18px;
            /* 设置更小的字体大小 */
        }

        .links a:hover .tooltip-text {
            visibility: visible;
            /* 鼠标悬停时显示 */
            opacity: 1;
        }

        .links a:hover {
            text-decoration: underline;
        }
        
        /* 调整最后一个链接的图标位置 */
        .icon-tools {
            transform: translateY(2px); /* 向下移动 几px */
        }

        .footer {
            font-family: Arial, sans-serif;
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
